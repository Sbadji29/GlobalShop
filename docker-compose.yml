services:

  # =========================
  # NODE 1 - AFRIQUE
  # =========================
  node1:
    image: postgres:16
    container_name: globalshop_node1
    restart: unless-stopped
    environment:
      POSTGRES_DB: globalshop
      POSTGRES_USER: globalshop
      POSTGRES_PASSWORD: globalshop123
    ports:
      - "5433:5432"
    volumes:
      - node1_data:/var/lib/postgresql/data
      - ./database/init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - globalshop_network


  # =========================
  # NODE 2 - EUROPE
  # =========================
  node2:
    image: postgres:16
    container_name: globalshop_node2
    restart: unless-stopped
    environment:
      POSTGRES_DB: globalshop
      POSTGRES_USER: globalshop
      POSTGRES_PASSWORD: globalshop123
    ports:
      - "5434:5432"
    volumes:
      - node2_data:/var/lib/postgresql/data
      - ./database/init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - globalshop_network


  # =========================
  # NODE 3 - AMERIQUE
  # =========================
  node3:
    image: postgres:16
    container_name: globalshop_node3
    restart: unless-stopped
    environment:
      POSTGRES_DB: globalshop
      POSTGRES_USER: globalshop
      POSTGRES_PASSWORD: globalshop123
    ports:
      - "5435:5432"
    volumes:
      - node3_data:/var/lib/postgresql/data
      - ./database/init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - globalshop_network


  # =========================
  # NODE 4 - ASIE
  # =========================
  node4:
    image: postgres:16
    container_name: globalshop_node4
    restart: unless-stopped
    environment:
      POSTGRES_DB: globalshop
      POSTGRES_USER: globalshop
      POSTGRES_PASSWORD: globalshop123
    ports:
      - "5436:5432"
    volumes:
      - node4_data:/var/lib/postgresql/data
      - ./database/init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - globalshop_network


# =========================
# VOLUMES
# =========================
volumes:
  node1_data:
  node2_data:
  node3_data:
  node4_data:


# =========================
# NETWORK
# =========================
networks:
  globalshop_network:
    driver: bridge